<div class="profile-container w-full max-w-[1024px] mx-auto px-4 md:px-8 py-8 md:py-10 flex flex-col gap-8 animate-in fade-in slide-in-from-bottom-2 duration-300">
  <!-- Tab switcher -->
  <div class="tab-switcher flex gap-2 p-1 rounded-2xl w-fit" style="background: rgba(45,139,87,0.08);">
    <button
      (click)="setActiveTab('medicos')"
      class="flex items-center gap-2 h-[41px] px-4 rounded-[14px] text-[14px] transition-colors cursor-pointer font-medium"
      [style.background]="activeTab === 'medicos' ? '#2d8b57' : 'transparent'"
      [style.color]="activeTab === 'medicos' ? 'white' : '#2d8b57'"
    >
      <mat-icon class="icon-sm">description</mat-icon>
      Informes médicos
    </button>
    <button
      (click)="setActiveTab('preferencias')"
      class="flex items-center gap-2 h-[41px] px-4 rounded-[14px] text-[14px] transition-colors cursor-pointer font-medium"
      [style.background]="activeTab === 'preferencias' ? '#2d8b57' : 'transparent'"
      [style.color]="activeTab === 'preferencias' ? 'white' : '#2d8b57'"
    >
      <mat-icon class="icon-sm">tune</mat-icon>
      Preferencias
    </button>
  </div>

  <!-- Content Preferencias -->
  <div *ngIf="activeTab === 'preferencias'" class="flex flex-col gap-8 w-full animate-in fade-in duration-300">
    
    <!-- Alergias -->
    <div class="section-card w-full">
      <div class="flex items-center gap-2 mb-4">
        <mat-icon class="text-amber-600">warning</mat-icon>
        <h3 class="text-[#1a2e23] font-bold text-xl m-0">Alergias</h3>
      </div>
      <div class="bg-white rounded-[20px] px-6 py-5 flex flex-col gap-4 shadow-sm" style="border: 0.917px solid rgba(45,139,87,0.12);">
        <p *ngIf="alergias.length === 0" class="text-gray-400 text-sm m-0">Sin alergias registradas</p>
        
        <div *ngIf="alergias.length > 0" class="flex flex-wrap gap-2">
          <span *ngFor="let item of alergias" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[13px] bg-amber-50 text-amber-700 border border-amber-200">
            {{ item }}
            <button (click)="removeAlergia(item)" class="opacity-60 hover:opacity-100 transition-opacity flex items-center justify-center">
              <mat-icon style="font-size: 14px; width: 14px; height: 14px;">close</mat-icon>
            </button>
          </span>
        </div>

        <div class="flex gap-2">
          <input
            type="text"
            placeholder="Nueva alergia..."
            [(ngModel)]="alergiaInput"
            (keydown)="onAlergiaKey($event)"
            class="flex-1 h-[39px] px-4 rounded-[14px] text-[14px] outline-none focus:border-[#2d8b57]"
            style="border: 0.917px solid #e5e7eb; color: rgba(10,10,10,0.8);"
          />
          <button
            (click)="addAlergia()"
            class="w-12 h-[39px] bg-[#2d8b57] rounded-[14px] flex items-center justify-center hover:bg-[#256e46] transition-colors text-white shrink-0"
          >
            <mat-icon style="font-size: 20px; width: 20px; height: 20px;">add</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Le Agrada -->
    <div class="section-card w-full">
      <div class="flex items-center gap-2 mb-4">
        <mat-icon class="text-emerald-600">thumb_up</mat-icon>
        <h3 class="text-[#1a2e23] font-bold text-xl m-0">Le agrada</h3>
      </div>
      <div class="bg-white rounded-[20px] px-6 py-5 flex flex-col gap-4 shadow-sm" style="border: 0.917px solid rgba(45,139,87,0.12);">
        <p *ngIf="agrada.length === 0" class="text-gray-400 text-sm m-0">Sin preferencias registradas</p>
        
        <div *ngIf="agrada.length > 0" class="flex flex-wrap gap-2">
          <span *ngFor="let item of agrada" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[13px] bg-emerald-50 text-emerald-700 border border-emerald-200">
            {{ item }}
            <button (click)="removeAgrada(item)" class="opacity-60 hover:opacity-100 transition-opacity flex items-center justify-center">
              <mat-icon style="font-size: 14px; width: 14px; height: 14px;">close</mat-icon>
            </button>
          </span>
        </div>

        <div class="flex gap-2">
          <input
            type="text"
            placeholder="Nuevo alimento..."
            [(ngModel)]="agradaInput"
            (keydown)="onAgradaKey($event)"
            class="flex-1 h-[39px] px-4 rounded-[14px] text-[14px] outline-none focus:border-[#2d8b57]"
            style="border: 0.917px solid #e5e7eb; color: rgba(10,10,10,0.8);"
          />
          <button
            (click)="addAgrada()"
            class="w-12 h-[39px] bg-[#2d8b57] rounded-[14px] flex items-center justify-center hover:bg-[#256e46] transition-colors text-white shrink-0"
          >
            <mat-icon style="font-size: 20px; width: 20px; height: 20px;">add</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- No le agrada -->
    <div class="section-card w-full">
      <div class="flex items-center gap-2 mb-4">
        <mat-icon class="text-red-600">thumb_down</mat-icon>
        <h3 class="text-[#1a2e23] font-bold text-xl m-0">No le agrada</h3>
      </div>
      <div class="bg-white rounded-[20px] px-6 py-5 flex flex-col gap-4 shadow-sm" style="border: 0.917px solid rgba(45,139,87,0.12);">
        <p *ngIf="noAgrada.length === 0" class="text-gray-400 text-sm m-0">Sin preferencias registradas</p>
        
        <div *ngIf="noAgrada.length > 0" class="flex flex-wrap gap-2">
          <span *ngFor="let item of noAgrada" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[13px] bg-red-50 text-red-700 border border-red-200">
            {{ item }}
            <button (click)="removeNoAgrada(item)" class="opacity-60 hover:opacity-100 transition-opacity flex items-center justify-center">
              <mat-icon style="font-size: 14px; width: 14px; height: 14px;">close</mat-icon>
            </button>
          </span>
        </div>

        <div class="flex gap-2">
          <input
            type="text"
            placeholder="Nuevo alimento..."
            [(ngModel)]="noAgradaInput"
            (keydown)="onNoAgradaKey($event)"
            class="flex-1 h-[39px] px-4 rounded-[14px] text-[14px] outline-none focus:border-[#2d8b57]"
            style="border: 0.917px solid #e5e7eb; color: rgba(10,10,10,0.8);"
          />
          <button
            (click)="addNoAgrada()"
            class="w-12 h-[39px] bg-[#2d8b57] rounded-[14px] flex items-center justify-center hover:bg-[#256e46] transition-colors text-white shrink-0"
          >
            <mat-icon style="font-size: 20px; width: 20px; height: 20px;">add</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Content Informes Médicos -->
  <div *ngIf="activeTab === 'medicos'" class="flex flex-col gap-6 w-full animate-in fade-in duration-300">
    <!-- Header row -->
    <div class="flex items-center justify-between w-full flex-wrap gap-4">
      <div class="flex flex-col gap-1">
        <h2 class="text-[#1a2e23] whitespace-nowrap text-2xl font-bold m-0">Informes médicos</h2>
        <p class="text-[#5a7a68] text-sm m-0">Sube y gestiona archivos PDF de informes médicos</p>
      </div>
      <button class="flex items-center justify-center gap-2 px-5 h-[41px] rounded-[14px] shrink-0 cursor-pointer transition-opacity hover:opacity-90 bg-[#2d8b57] text-white font-semibold text-sm shadow-sm border-none">
        <mat-icon class="icon-sm">add</mat-icon>
        Subir PDF
      </button>
    </div>

    <!-- Empty state -->
    <div class="bg-white rounded-[20px] px-8 py-16 flex flex-col items-center gap-4 shadow-sm w-full" style="border: 0.917px solid rgba(45,139,87,0.12);">
      <mat-icon class="text-gray-300" style="font-size: 48px; width: 48px; height: 48px;">note_add</mat-icon>
      <p class="text-gray-400 text-base m-0 text-center">No hay informes médicos subidos.</p>
    </div>
  </div>

</div>
