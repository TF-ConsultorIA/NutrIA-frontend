<div
  class="bg-white rounded-3xl overflow-hidden max-w-md relative shadow-2xl flex flex-col max-h-[90vh]"
>
  <div
    class="bg-linear-to-br from-[#53C285] to-primary p-8 flex flex-col items-center justify-center relative text-white"
  >
    <button
      (click)="onCancel()"
      class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/25 hover:bg-white/40 transition-colors flex items-center justify-center text-white cursor-pointer border-none outline-none"
    >
      <mat-icon class="scale-90">close</mat-icon>
    </button>

    <div class="w-14 h-14 text-white flex items-center justify-center">
      <mat-icon class="scale-[2.5]">restaurant_menu</mat-icon>
    </div>
  </div>

  <div class="overflow-y-auto p-6 space-y-6 scrollbar-hide flex-1">
    <div class="space-y-1">
      <div class="flex justify-between items-start gap-4">
        <h2 class="text-xl font-black text-[#1c3d2c] leading-tight">
          {{ food.foodName }}
        </h2>
      </div>

      <div class="flex items-center gap-4 text-xs font-semibold">
        <span class="flex items-center gap-1 text-orange-400">
          <mat-icon class="scale-75">local_fire_department</mat-icon>
          <span class="text-gray-400">{{ food.energy }} kcal</span>
        </span>
      </div>
    </div>

    <div class="space-y-3">
      <h3 class="text-xs font-bold text-[#1c3d2c] tracking-wide uppercase">
        Información nutricional <span class="text-gray-400 font-medium lowercase">(por 100g)</span>
      </h3>

      <div
        class="border border-gray-100 rounded-2xl overflow-hidden divide-y divide-gray-50 bg-gray-50/30"
      >
        @for (nutrient of nutrients(); track nutrient.label) {
          <div class="flex justify-between items-center py-2.5 px-4 text-sm">
            <span class="text-gray-500 font-medium">{{ nutrient.label }}</span>
            <span class="text-[#1c3d2c] font-black">{{ nutrient.value }}</span>
          </div>
        }
      </div>
    </div>

    <form
      [formGroup]="planForm"
      class="bg-white border border-gray-100 rounded-2xl p-4 shadow-xs space-y-4"
    >
      <h3 class="text-xs font-bold text-[#1c3d2c] tracking-wide uppercase">
        Selecciona día, horario y cantidad
      </h3>

      <div class="space-y-3">
        <div class="relative">
          <select
            formControlName="day"
            class="w-full bg-gray-50/50 border border-gray-200 rounded-xl py-2 px-3 text-sm text-gray-700 outline-none appearance-none focus:border-primary transition-colors"
          >
            <option [ngValue]="null" disabled selected hidden>Selecciona el día</option>
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
          </select>
          <mat-icon class="absolute right-3 top-2.5 text-gray-400 scale-75 pointer-events-none"
            >expand_more</mat-icon
          >
        </div>

        <div class="relative">
          <select
            formControlName="timeSlot"
            class="w-full bg-gray-50/50 border border-gray-200 rounded-xl py-2 px-3 text-sm text-gray-700 outline-none appearance-none focus:border-primary transition-colors"
          >
            <option [ngValue]="null" disabled selected hidden>Selecciona el horario</option>
            <option value="Desayuno">Desayuno</option>
            <option value="Almuerzo">Almuerzo</option>
            <option value="Cena">Cena</option>
          </select>
          <mat-icon class="absolute right-3 top-2.5 text-gray-400 scale-75 pointer-events-none"
            >expand_more</mat-icon
          >
        </div>

        <div class="space-y-1">
          <label class="block text-[11px] font-bold text-gray-400">Cantidad (gramos)</label>
          <input
            type="number"
            formControlName="amountGrams"
            class="w-full bg-white border border-gray-200 rounded-xl py-2 px-3 text-sm text-gray-700 outline-none focus:border-primary transition-colors"
          />
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="onCancel()"
          class="flex-1 py-2.5 border border-gray-200 text-gray-500 font-bold text-xs rounded-xl hover:bg-gray-50 transition-colors cursor-pointer"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="onAdd()"
          [disabled]="planForm.invalid"
          class="flex-1 py-2.5 bg-primary text-white font-bold text-xs rounded-xl hover:bg-[#236d44] transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Añadir
        </button>
      </div>
    </form>
  </div>
</div>
