<div class="flex gap-4 w-full mb-6">
  <div
    class="w-8 h-8 rounded-full bg-[#1c3d2c] flex justify-center items-center text-white shrink-0 mt-1 shadow-sm"
  >
    <mat-icon class="scale-75">smart_toy</mat-icon>
  </div>

  <div class="flex flex-col gap-1 max-w-[85%] md:max-w-[75%]">
    <div
      class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm p-4 text-gray-800 text-sm shadow-sm min-h-12 flex items-center"
    >
      @if (isLoading) {
        <div class="flex space-x-1.5 items-center px-1">
          <div
            class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"
            style="animation-delay: 0ms"
          ></div>
          <div
            class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"
            style="animation-delay: 150ms"
          ></div>
          <div
            class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"
            style="animation-delay: 300ms"
          ></div>
        </div>
      } @else {
        <div class="w-full">
          <ng-content></ng-content>
        </div>
      }
    </div>

    @if (!isLoading && time) {
      <span class="text-[10px] text-gray-400 pl-1">{{ time }}</span>
    }
  </div>
</div>
